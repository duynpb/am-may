services:
  - type: web
    name: am-may
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/rooms
    autoDeploy: true
    envVars:
      # Chuỗi kết nối Postgres (Neon, Supabase…) — điền trong Render, không ghi vào code
      - key: DATABASE_URL
        sync: false
